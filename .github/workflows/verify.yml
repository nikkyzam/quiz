name: Verify requirements

on:
  push: { branches: [main] }
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # node:sqlite and node:crypto scrypt are built in; no native build needed.
      - uses: actions/setup-node@v4
        with: { node-version: '24' }

      - name: Confirm node:sqlite is available
        run: node -e "const {DatabaseSync}=require('node:sqlite'); new DatabaseSync(':memory:'); console.log('node:sqlite OK on', process.version)"

      - name: Install API dependencies
        working-directory: app/server
        run: npm install --no-audit --no-fund

      # The accessibility check renders real components and runs axe, so the
      # web dependencies and the SSR bundle are both required.
      - name: Install web dependencies
        working-directory: app/web
        run: npm install --no-audit --no-fund

      - name: Build accessibility render bundle
        working-directory: app/web
        run: ./node_modules/.bin/esbuild a11y/render.tsx --bundle --platform=node --format=esm --outfile=a11y/render.mjs --jsx=automatic --external:react --external:react-dom

      - name: Typecheck web
        working-directory: app/web
        run: ./node_modules/.bin/tsc -b --pretty false

      # Real page-load timing (10.1) runs the production build in headless
      # Chromium under throttled network profiles.
      - name: Install Chromium for page-load measurement
        working-directory: app/web
        run: npx playwright-core install --with-deps chromium || npx playwright install --with-deps chromium

      - uses: hashicorp/setup-terraform@v3
        with: { terraform_wrapper: false }
      - name: Validate infrastructure as code
        working-directory: infra/terraform
        run: terraform init -backend=false -input=false && terraform validate

      # Fails the build if any requirement claims `done` without a passing check.
      - name: Verify requirements
        run: node requirements/verify.mjs

      - name: Upload status report
        if: always()
        run: node requirements/verify.mjs --report || true
