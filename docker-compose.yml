# Self-hosting on any Docker host (spec 11.7).
#   DATA_KEY="$(head -c 32 /dev/urandom | base64)" ADMIN_EMAILS=you@example.com docker compose up -d --build
services:
  beastforge:
    build: .
    ports:
      - "8080:8080"
    environment:
      NODE_ENV: production
      PORT: "8080"
      DB_FILE: /data/mathquest.db
      DATA_KEY: ${DATA_KEY:?set DATA_KEY to a 32-byte base64 key}
      ADMIN_EMAILS: ${ADMIN_EMAILS:-}
      BACKUP_INTERVAL_HOURS: "6"
      BACKUP_DIR: /data/backups
      BACKUP_ENCRYPT: "1"
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:8080}
    volumes:
      - beastforge_data:/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:8080/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 3s
      start_period: 10s
    restart: unless-stopped

volumes:
  beastforge_data:
